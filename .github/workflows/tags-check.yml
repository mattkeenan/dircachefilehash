name: Tags Check

on:
  push:
    branches: [ main, claude-code-experiment ]
  pull_request:
    branches: [ main ]

jobs:
  check-tags:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install gotags
      run: go install github.com/jstemmer/gotags@latest
    
    - name: Generate tags file
      run: gotags -R -f tags .
    
    - name: Verify tags file is up to date
      run: |
        if git diff --quiet tags; then
          echo "✅ Tags file is up to date"
        else
          echo "❌ Tags file is outdated!"
          echo ""
          echo "The tags file is not up to date with the current codebase."
          echo "Please run the following command and commit the changes:"
          echo ""
          echo "  gotags -R -f tags ."
          echo "  git add tags"
          echo "  git commit -m 'chore: update tags file'"
          echo ""
          echo "Differences found:"
          git diff tags
          exit 1
        fi
    
    - name: Validate tags file format
      run: |
        if [ ! -f tags ]; then
          echo "❌ Tags file does not exist"
          exit 1
        fi
        
        # Check if tags file has content
        if [ ! -s tags ]; then
          echo "❌ Tags file is empty"
          exit 1
        fi
        
        # Basic format validation - tags file should have tab-separated columns
        if ! head -1 tags | grep -q $'\t'; then
          echo "❌ Tags file appears to be malformed (no tab separators found)"
          exit 1
        fi
        
        echo "✅ Tags file format appears valid"
        echo "Tags file contains $(wc -l < tags) entries"