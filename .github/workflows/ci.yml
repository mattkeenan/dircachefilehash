name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Verify Go modules
      run: go mod verify

    - name: Build binaries
      run: make build

    - name: Run tests
      run: make test

    - name: Test CLI functionality
      run: |
        ./dcfh --version
        ./dcfh --help

    - name: Run performance benchmarks
      run: |
        chmod +x ./run_benchmarks.sh
        ./run_benchmarks.sh -t small

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Generate version constants
      run: go generate ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.2
        args: --timeout=5m
