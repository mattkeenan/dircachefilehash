version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bidichk        # dangerous unicode sequences
    - copyloopvar    # loop variable capture bugs
    - cyclop         # cyclomatic complexity per function
    - durationcheck  # duration multiplication mistakes
    - errname        # sentinel error naming conventions
    - errorlint      # error wrapping best practices
    - gocognit       # cognitive complexity per function
    - gocritic       # broad set of style and correctness checks
    - gosec          # security-focused static analysis
    - misspell       # spelling mistakes in comments/strings
    - nilerr         # returning nil when err is not nil
    - prealloc       # suggest preallocating slices
    - unconvert      # unnecessary type conversions
    - unparam        # unused function parameters
    - usestdlibvars  # use stdlib constants (http.StatusOK, etc.)
    - wastedassign   # assignments that are never read

  settings:
    govet:
      # enable-all gives parity with `go vet` (and then some). The three
      # disables below are analyzers govet's enable-all turns on but
      # `cmd/vet` does not run by default — keeping them off matches
      # the behaviour the pre-commit hook used to get from raw go vet:
      #   - fieldalignment: binaryEntry layout is intentional and locked
      #     by build-time assertions in pkg/binary_entry.go.
      #   - shadow: experimental, very noisy.
      #   - nilness: experimental, not in cmd/vet's default suite.
      # unsafeptr stays enabled; the four known false positives in
      # pkg/binary_entry.go are suppressed per-line via //nolint:govet.
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        - nilness

    gocritic:
      disabled-checks:
        - ifElseChain  # too opinionated for algorithmic code with clear branch logic

    gosec:
      # NB: setting gosec.excludes activates gosec's FULL ruleset (the
      # subset golangci-lint runs by default is wider once this key is
      # present). Each exclusion below is a deliberate, documented call.
      excludes:
        # --- Permanent: architectural / intentional ---
        - G103  # use of unsafe — the zero-copy/mmap design (pkg/binary_entry.go)
        - G304  # file path from variable — dcfh is a file scanner by definition
        - G401  # SHA-1 — git-compatible content addressing, not a security hash
        - G505  # crypto/sha1 import — same git-compatibility rationale as G401
        # --- Deferred: genuine bug, tracked in BACKLOG (Very High) ---
        - G115  # int overflow on conversion — inode/device truncation bug;
                # re-enable once Dev/Ino widen to uint64. See BACKLOG.md.

    cyclop:
      max-complexity: 20

    gocognit:
      min-complexity: 30

  exclusions:
    presets:
      - std-error-handling
    rules:
      # dcfhfix uses %v intentionally in some error paths (repair tool, errors not wrapped).
      - linters: [errorlint]
        path: cmd/dcfhfix/
        text: "non-wrapping format verb"
      # Test code: direct error comparison and type assertions are fine for sentinel errors.
      - linters: [errorlint]
        path: _test\.go
      # Complexity linters don't apply to test code or shared test framework files.
      - linters: [cyclop, gocognit]
        path: _test\.go
      - linters: [cyclop, gocognit]
        path: _test_framework\.go
      # Test code: gosec findings are false positives in test harnesses
      # (G204 launching the built binary, G602 with explicit bounds guards,
      # 0644/0755 fixture perms). Production gosec rules stay active.
      - linters: [gosec]
        path: _test\.go

# Show every finding. golangci-lint defaults to hiding all but the first
# 3 instances of the same issue (max-same-issues) and capping each linter
# at 50 (max-issues-per-linter). For a security gate, silently dropping
# findings is a real gap — a 4th instance of an insecure pattern could
# pass `--new` review unseen. Lift both caps so gosec surfaces everything.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
